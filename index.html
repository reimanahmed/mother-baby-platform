<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinder Store | متجر المستلزمات العالمي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d81b60;
            --primary-hover: #c2185b;
            --bg-body: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-body: #0f1115;
            --card-bg: #1e222a;
            --text-main: #f1f1f1;
            --text-muted: #a0a0a0;
            --border-color: #2e3440;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); transition: 0.3s; }

        .top-banner {
            background: linear-gradient(90deg, #d81b60, #8e24aa);
            color: white; text-align: center; padding: 8px 15px; font-size: 13px; font-weight: 600;
        }

        header {
            background: var(--card-bg); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1200px; margin: 0 auto; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }

        .brand-logo { font-size: 26px; font-weight: 800; color: var(--primary-color); text-decoration: none; }

        .search-bar-container { flex: 1; max-width: 550px; position: relative; }
        .search-bar-container input {
            width: 100%; padding: 10px 18px; padding-left: 45px; border-radius: 25px;
            border: 1.5px solid var(--border-color); background: var(--bg-body); color: var(--text-main); outline: none;
        }

        .header-actions { display: flex; align-items: center; gap: 15px; }
        .action-btn {
            background: none; border: none; color: var(--text-main); font-size: 14px;
            font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px;
        }
        .cart-btn { background: var(--primary-color); color: white; border-radius: 20px; padding: 8px 16px; }

        .store-container {
            max-width: 1200px; margin: 30px auto; padding: 0 20px;
            display: grid; grid-template-columns: 240px 1fr; gap: 30px;
        }

        .filters-sidebar {
            background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); height: fit-content;
        }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
        }

        .product-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 15px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

        .product-img-box {
            width: 100%; height: 140px; background: var(--bg-body); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 10px;
        }

        .add-cart-btn {
            background: var(--primary-color); color: white; border: none; padding: 8px 12px;
            border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;
        }

        /* Modal Styles (السلة والنوافذ المنبثقة) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-box {
            background: var(--card-bg); width: 90%; max-width: 500px; border-radius: 16px; padding: 25px;
            max-height: 85vh; overflow-y: auto; position: relative;
        }
        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 20px; cursor: pointer; border: none; background: none; color: var(--text-main); }

        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border-color);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); outline: none; }

        .checkout-btn {
            width: 100%; background: #2e7d32; color: white; border: none; padding: 12px;
            border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 15px;
        }

        @media (max-width: 768px) {
            .store-container { grid-template-columns: 1fr; }
            .filters-sidebar { display: none; }
        }
    </style>
</head>
<body>

    <div class="top-banner">✨ شحن مجاني للطلبات الأكثر من 50,000 دينار | منصة Kinder العالمية</div>

    <header>
        <div class="header-container">
            <a href="#" class="brand-logo">Kinder 🌸</a>
            <div class="search-bar-container">
                <input type="text" id="searchInput" placeholder="ابحث عن المنتجات..." onkeyup="filterProducts()">
            </div>
            <div class="header-actions">
                <button class="action-btn" onclick="toggleDarkMode()">🌙 المظهر</button>
                <button class="action-btn cart-btn" onclick="openCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
            </div>
        </div>
    </header>

    <div class="store-container">
        <aside class="filters-sidebar">
            <h3>التصفية</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 10px;">اختر الفئات لعرض المنتجات المناسبة.</p>
        </aside>

        <main>
            <div class="products-grid" id="productsGrid"></div>
        </main>
    </div>

    <!-- نافذة سلة التسوق (Cart Modal) -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeCart()">✕</button>
            <h3 style="margin-bottom: 15px;">سلة التسوق 🛒</h3>
            <div id="cartItemsContainer"></div>
            <div style="margin-top: 15px; font-weight: bold; font-size: 16px;">
                المجموع الكلي: <span id="cartTotalPrice" style="color: var(--primary-color);">0 د.ع</span>
            </div>
            <button class="checkout-btn" onclick="openCheckout()">إتمام الطلب الآن 💳</button>
        </div>
    </div>

    <!-- نافذة إدخال بيانات الزبون (Checkout Modal) -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeCheckout()">✕</button>
            <h3 style="margin-bottom: 15px;">بيانات التوصيل 🚚</h3>
            <form id="orderForm" onsubmit="sendOrderToTelegram(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="custName" required placeholder="أدخلي اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="custPhone" required placeholder="07XXXXXXXXX">
                </div>
                <div class="form-group">
                    <label>العنوان / المحافظة والمنطقة</label>
                    <input type="text" id="custAddress" required placeholder="مثال: بغداد - المنصور">
                </div>
                <button type="submit" class="checkout-btn" style="background: var(--primary-color);">تأكيد وإرسال الطلب ✨</button>
            </form>
        </div>
    </div>

    <script>
        const productsList = [
            { id: 1, icon: '🍼', category: 'الرضاعة', title: 'رضّاعة أطفال طبية مضادة للمغص 260 مل', price: 15000 },
            { id: 2, icon: '🛏️', category: 'أثاث', title: 'سرير أطفال خشبي خيزران مزود بهزاز', price: 85000 },
            { id: 3, icon: '🛒', category: 'عربات', title: 'عربة أطفال خفيفة الوزن قابلة للطي', price: 120000 },
            { id: 4, icon: '🧸', category: 'ألعاب', title: 'مجموعة ألعاب مهدئة ومطورة للحواس', price: 10000 },
            { id: 5, icon: '👕', category: 'ملابس', title: 'طقم ملابس قطن طبيعي (5 قطعات)', price: 25000 },
            { id: 6, icon: '🧼', category: 'عناية', title: 'مجموعة العناية الشاملة ببشرة الرضيع', price: 18000 }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            items.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-box">${p.icon}</div>
                    <div style="font-size:11px; color:var(--text-muted);">${p.category}</div>
                    <div style="font-weight:700; margin:5px 0;">${p.title}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                        <span style="font-weight:800; color:var(--primary-color);">${p.price.toLocaleString()} د.ع</span>
                        <button class="add-cart-btn" onclick="addToCart(${p.id})">إضافة للسلة 🛒</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = productsList.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);
            if(exist) {
                exist.qty += 1;
            } else {
                cart.push({...product, qty: 1});
            }
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').textContent = count;
            
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div>
                        <div style="font-weight:bold; font-size:13px;">${item.title}</div>
                        <div style="font-size:12px; color:var(--text-muted);">${item.price.toLocaleString()} د.ع × ${item.qty}</div>
                    </div>
                    <button style="border:none; background:none; color:red; cursor:pointer;" onclick="removeFromCart(${item.id})">حذف</button>
                `;
                container.appendChild(div);
            });

            document.getElementById('cartTotalPrice').textContent = total.toLocaleString() + ' د.ع';
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function openCart() { document.getElementById('cartModal').style.display = 'flex'; }
        function closeCart() { document.getElementById('cartModal').style.display = 'none'; }
        function openCheckout() {
            if(cart.length === 0) return alert('السلة فارغة!');
            closeCart();
            document.getElementById('checkoutModal').style.display = 'flex';
        }
        function closeCheckout() { document.getElementById('checkoutModal').style.display = 'none'; }

        // إرسال تفاصيل الطلب إلى تليجرام
        function sendOrderToTelegram(e) {
            e.preventDefault();
            
            // ⚠️ استبدلي هذه القيم بـ Token البوت و Chat ID الخاصين بكِ في تليجرام
            const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
            const CHAT_ID = "YOUR_CHAT_ID_HERE";

            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            let orderSummary = `🛍️ *طلب جديد من متجر Kinder*:\n\n`;
            orderSummary += `👤 *الزبون:* ${name}\n📱 *الهاتف:* ${phone}\n📍 *العنوان:* ${address}\n\n📦 *المنتجات:*\n`;

            let total = 0;
            cart.forEach(item => {
                orderSummary += `- ${item.title} (العدد: ${item.qty}) -> ${(item.price * item.qty).toLocaleString()} د.ع\n`;
                total += item.price * item.qty;
            });

            orderSummary += `\n💵 *المجموع الكلي:* ${total.toLocaleString()} د.ع`;

            // في حال عدم توفر البوت حالياً يتم طباعة التنبيه للزبون
            if(BOT_TOKEN === "YOUR_BOT_TOKEN_HERE") {
                alert(`تم استلام طلبكِ بنجاح يا ${name}! سنتصل بكِ على الرقم ${phone} لتأكيد التوصيل.`);
            } else {
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: orderSummary, parse_mode: 'Markdown' })
                }).then(() => {
                    alert('تم إرسال طلبكِ بنجاح!');
                });
            }

            cart = [];
            updateCartUI();
            closeCheckout();
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        window.onload = () => { renderProducts(productsList); };
    </script>
</body>
</html>
