<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinder Store | متجر المستلزمات العالمي</title>
    <!-- خط القاهرة + مكتبة أيقونات Bootstrap Icons العالمية الممتازة بدلاً من إيموجيات الكيبورد -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* لوحة ألوان هادئة ومستوحاة من أسلوب Pinterest النظيف (Pastel Aesthetic) */
        :root {
            --primary-color: #e29578;       /* وردي ناعم دافئ */
            --primary-hover: #d88365;
            --secondary-color: #ffddd2;     /* باستيل مشمشي ناعم */
            --accent-color: #83c5be;        /* تاكواز هادئ للمستلزمات */
            --bg-body: #fdfbf7;             /* أوف وايت كريمي هادئ جداً */
            --card-bg: #ffffff;
            --text-main: #2b2d42;           /* كحلي رمادي دافئ بدلاً من الأسود الحاد */
            --text-muted: #8d99ae;
            --border-color: #f0eae1;
            --shadow-sm: 0 4px 12px rgba(226, 149, 120, 0.08);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        body.dark-mode {
            --bg-body: #18191a;
            --card-bg: #242526;
            --text-main: #e4e6eb;
            --text-muted: #b0b3b8;
            --border-color: #3a3b3c;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); transition: all 0.3s ease; }

        /* الشريط الترويجي */
        .top-banner {
            background: linear-gradient(90deg, #e29578, #eddcd2);
            color: #4a3b32; text-align: center; padding: 9px 15px; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* الهيدر العلوي */
        header {
            background: var(--card-bg); border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1200px; margin: 0 auto; padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }

        .brand-logo { 
            font-size: 26px; font-weight: 800; color: var(--primary-color); 
            text-decoration: none; display: flex; align-items: center; gap: 8px; 
        }

        .search-bar-container { flex: 1; max-width: 500px; position: relative; }
        .search-bar-container input {
            width: 100%; padding: 10px 20px; padding-left: 45px; border-radius: 30px;
            border: 1.5px solid var(--border-color); background: var(--bg-body); color: var(--text-main); 
            outline: none; font-size: 13px; transition: border-color 0.2s;
        }
        .search-bar-container input:focus { border-color: var(--primary-color); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .header-actions { display: flex; align-items: center; gap: 12px; }
        .action-btn {
            background: var(--bg-body); border: 1px solid var(--border-color); color: var(--text-main); 
            font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; 
            padding: 8px 14px; border-radius: 20px; transition: 0.2s;
        }
        .action-btn:hover { background: var(--secondary-color); }
        .cart-btn { background: var(--primary-color); color: white; border: none; }
        .cart-btn:hover { background: var(--primary-hover); }

        /* البانر الترويجي الأنيق (Pinterest Hero Banner) */
        .hero-banner {
            max-width: 1200px; margin: 25px auto 0; padding: 0 20px;
        }
        .hero-box {
            background: linear-gradient(135deg, #fefae0 0%, #ffddd2 100%);
            border-radius: 20px; padding: 35px 40px; display: flex; justify-content: space-between; 
            align-items: center; border: 1px solid #f2e2d2;
        }
        .dark-mode .hero-box {
            background: linear-gradient(135deg, #2b262d 0%, #3d2b35 100%);
            border-color: #4a3642;
        }
        .hero-title { font-size: 26px; font-weight: 800; color: #6b4335; margin-bottom: 6px; }
        .dark-mode .hero-title { color: #f4c2c2; }
        .hero-subtitle { font-size: 14px; color: #8d6e63; }
        .hero-icon-large { font-size: 55px; color: var(--primary-color); }

        /* شبكة المنتجات والقوائم */
        .store-container {
            max-width: 1200px; margin: 30px auto; padding: 0 20px;
            display: grid; grid-template-columns: 240px 1fr; gap: 30px;
        }

        .filters-sidebar {
            background: var(--card-bg); border-radius: 16px; padding: 22px; 
            border: 1px solid var(--border-color); height: fit-content; box-shadow: var(--shadow-sm);
        }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
        }

        .product-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 18px; display: flex; flex-direction: column; justify-content: space-between; 
            transition: all 0.2s ease-in-out; position: relative;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }

        /* حاوية الأيقونات الجرافيكية الاحترافية للمنتجات */
        .product-img-box {
            width: 100%; height: 130px; background: var(--bg-body); border-radius: 12px;
            display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
        }
        .product-img-box i { font-size: 48px; color: var(--primary-color); }

        .add-cart-btn {
            background: var(--primary-color); color: white; border: none; padding: 8px 14px;
            border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .add-cart-btn:hover { background: var(--primary-hover); }

        /* النوافذ المنبثقة */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; 
            justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-box {
            background: var(--card-bg); width: 90%; max-width: 480px; border-radius: 20px; padding: 25px;
            box-shadow: var(--shadow-md); position: relative;
        }
        .close-btn { position: absolute; top: 18px; left: 20px; font-size: 18px; cursor: pointer; border: none; background: none; color: var(--text-muted); }

        @media (max-width: 768px) {
            .store-container { grid-template-columns: 1fr; }
            .filters-sidebar { display: none; }
        }
    </style>
</head>
<body>

    <!-- الشريط الترويجي -->
    <div class="top-banner">
        <i class="bi bi-stars"></i>
        <span>شحن مجاني للطلبات الأكثر من 50,000 دينار | عالم Kinder للأطفال</span>
    </div>

    <!-- الهيدر الرئيسي -->
    <header>
        <div class="header-container">
            <a href="#" class="brand-logo">
                <i class="bi bi-heart-pulse-fill"></i> Kinder
            </a>

            <div class="search-bar-container">
                <input type="text" id="searchInput" placeholder="ابحثي عن مستلزمات الأطفال، الأسرة، الرضّاعات..." onkeyup="filterProducts()">
                <i class="bi bi-search search-icon"></i>
            </div>

            <div class="header-actions">
                <button class="action-btn" onclick="toggleDarkMode()">
                    <i class="bi bi-moon-stars"></i> المظهر
                </button>
                <button class="action-btn cart-btn" onclick="openCart()">
                    <i class="bi bi-bag-heart-fill"></i> السلة (<span id="cartCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- البانر الترويجي -->
    <section class="hero-banner">
        <div class="hero-box">
            <div>
                <h1 class="hero-title">عالم Kinder للمستلزمات الحديثة</h1>
                <p class="hero-subtitle">تسوقي أحدث وأفضل المنتجات المعتمدة لطفلكِ بألوان وتصاميم مريحة</p>
            </div>
            <i class="bi bi-balloon-heart hero-icon-large"></i>
        </div>
    </section>

    <!-- المتجر -->
    <div class="store-container">
        <aside class="filters-sidebar">
            <h3 style="font-size: 15px; margin-bottom: 15px;"><i class="bi bi-sliders"></i> التصفية والخيارات</h3>
            <p style="font-size: 12px; color: var(--text-muted);">حددي القسم لعرض المنتجات المناسبة لطفلكِ.</p>
        </aside>

        <main>
            <div class="products-grid" id="productsGrid"></div>
        </main>
    </div>

    <!-- نافذة سلة التسوق -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeCart()"><i class="bi bi-x-lg"></i></button>
            <h3 style="margin-bottom: 15px; font-size: 16px;"><i class="bi bi-bag-check"></i> سلة التسوق الخاصة بكِ</h3>
            <div id="cartItemsContainer"></div>
            <div style="margin-top: 20px; font-weight: bold; font-size: 15px; display:flex; justify-content:space-between;">
                <span>المجموع الكلي:</span>
                <span id="cartTotalPrice" style="color: var(--primary-color);">0 د.ع</span>
            </div>
            <button style="width:100%; background:var(--primary-color); color:white; border:none; padding:12px; border-radius:10px; margin-top:15px; font-weight:700; cursor:pointer;" onclick="openCheckout()">
                <i class="bi bi-credit-card"></i> إتمام الطلب الآن
            </button>
        </div>
    </div>

    <script>
        /* استخدام أيقونات Vector SVG ناعمة مخصصة لكل منتج بدلاً من الإيموجيات */
        const productsList = [
            { id: 1, iconClass: 'bi bi-cup-straw', category: 'الرضاعة والتغذية', title: 'رضّاعة أطفال طبية مضادة للمغص 260 مل', price: 15000 },
            { id: 2, iconClass: 'bi bi-house-heart', category: 'أثاث ونوم الأطفال', title: 'سرير أطفال خشبي خيزران مزود بهزاز', price: 85000 },
            { id: 3, iconClass: 'bi bi-truck-front', category: 'العربات ومستلزمات السفر', title: 'عربة أطفال خفيفة الوزن قابلة للطي للطيار', price: 120000 },
            { id: 4, iconClass: 'bi bi-puzzle', category: 'الألعاب والتعليم', title: 'مجموعة ألعاب مهدئة ومطورة للحواس', price: 10000 },
            { id: 5, iconClass: 'bi bi-backpack2', category: 'الملابس والاحتياجات', title: 'طقم ملابس قطن طبيعي لحديثي الولادة', price: 25000 },
            { id: 6, iconClass: 'bi bi-droplet-half', category: 'العناية بالبشرة', title: 'مجموعة العناية الشاملة ببشرة الرضيع', price: 18000 }
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            items.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img-box"><i class="${p.iconClass}"></i></div>
                    <div style="font-size:11px; color:var(--text-muted); font-weight:700;">${p.category}</div>
                    <div style="font-weight:700; margin:6px 0; font-size:13px; color:var(--text-main);">${p.title}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
                        <span style="font-weight:800; color:var(--primary-color); font-size:14px;">${p.price.toLocaleString()} د.ع</span>
                        <button class="add-cart-btn" onclick="addToCart(${p.id})">
                            <i class="bi bi-cart-plus"></i> إضافة
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = productsList.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);
            if(exist) { exist.qty += 1; } else { cart.push({...product, qty: 1}); }
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').textContent = count;
            
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                const div = document.createElement('div');
                div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-color); font-size:13px;';
                div.innerHTML = `
                    <div>
                        <div style="font-weight:bold;">${item.title}</div>
                        <div style="color:var(--text-muted); font-size:12px;">${item.price.toLocaleString()} د.ع × ${item.qty}</div>
                    </div>
                    <button style="border:none; background:none; color:#e63946; cursor:pointer;" onclick="removeFromCart(${item.id})"><i class="bi bi-trash"></i></button>
                `;
                container.appendChild(div);
            });

            document.getElementById('cartTotalPrice').textContent = total.toLocaleString() + ' د.ع';
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function openCart() { document.getElementById('cartModal').style.display = 'flex'; }
        function closeCart() { document.getElementById('cartModal').style.display = 'none'; }
        function openCheckout() {
            if(cart.length === 0) return alert('السلة فارغة حالياً!');
            alert('تم الانتقال لخطوة إتمام الطلب!');
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = productsList.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        window.onload = () => { renderProducts(productsList); };
    </script>
</body>
</html>
