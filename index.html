<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinder - منصة الأم والطفل</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --primary-pink: #d81b60;
            --border-color: #eee;
        }

        /* تعديل ألوان الوضع الداكن لتكون البطاقات متباينة وواضحة */
        body.dark-mode {
            --bg-color: #181818;
            --card-bg: #282828;
            --text-color: #ffffff;
            --border-color: #3e3e3e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo { font-weight: bold; font-size: 18px; color: var(--primary-pink); }

        .lang-btn {
            background: #e0e0e0;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .lang-btn.active {
            background: var(--primary-pink);
            color: white;
        }

        .app-screen { display: none; padding: 15px; }
        .app-screen.active { display: block; }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: 15px auto;
        }

        /* تنسيق بطاقات السوق لتظهر بشكل واضح في الوضعين */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .product-icon { font-size: 35px; margin-bottom: 8px; }
        .product-title { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: var(--text-color); }
        .product-price { font-size: 12px; color: var(--primary-pink); font-weight: bold; }

        .search-box {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            max-width: 500px;
            display: block;
            margin: 0 auto;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active { color: var(--primary-pink); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Kinder 🌸</div>
        <div style="display:flex; gap:8px;">
            <button onclick="toggleDarkMode()" style="background:none; border:none; cursor:pointer; font-size:18px;">🌙</button>
            <button id="btn-ar" onclick="switchLang('ar')" class="lang-btn active">AR</button>
            <button id="btn-ku" onclick="switchLang('ku')" class="lang-btn">KU</button>
            <button id="btn-en" onclick="switchLang('en')" class="lang-btn">EN</button>
        </div>
    </nav>

    <!-- شاشة السوق مع بطاقات المنتجات المباشرة -->
    <div id="screen-market" class="app-screen active">
        <h2 style="text-align:center;" data-i18n="market_title">سوق Kinder للمستلزمات 🛍️</h2>
        <input type="text" id="marketSearch" class="search-box" placeholder="🔍 بحث..." onkeyup="filterProducts()">
        
        <div class="market-grid" id="productsContainer">
            <div class="product-card">
                <div class="product-icon">🍼</div>
                <div class="product-title" data-i18n="p1">رضّاعة أطفال طبية</div>
                <div class="product-price">15,000 د.ع</div>
            </div>
            <div class="product-card">
                <div class="product-icon">🛏️</div>
                <div class="product-title" data-i18n="p2">سرير أطفال خشبي</div>
                <div class="product-price">85,000 د.ع</div>
            </div>
            <div class="product-card">
                <div class="product-icon">🛒</div>
                <div class="product-title" data-i18n="p3">عربة أطفال خفيفة</div>
                <div class="product-price">120,000 د.ع</div>
            </div>
            <div class="product-card">
                <div class="product-icon">🧸</div>
                <div class="product-title" data-i18n="p4">مجموعة ألعاب مهدئة</div>
                <div class="product-price">10,000 د.ع</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <span>🛍️</span>
            <span data-i18n="nav_market">السوق</span>
        </div>
    </div>

    <script>
        const i18n = {
            ar: { market_title: "سوق Kinder للمستلزمات 🛍️", nav_market: "السوق", p1: "رضّاعة أطفال طبية", p2: "سرير أطفال خشبي", p3: "عربة أطفال خفيفة", p4: "مجموعة ألعاب مهدئة" },
            ku: { market_title: "بازاڕی Kinder 🛍️", nav_market: "بازاڕ", p1: "شیردانی پزیشکی", p2: "تەختی تەختەیی", p3: "عەرەبانەی سووک", p4: "کۆمەڵە یاری" },
            en: { market_title: "Kinder Marketplace 🛍️", nav_market: "Market", p1: "Baby Bottle", p2: "Wooden Baby Bed", p3: "Baby Stroller", p4: "Soothing Toys" }
        };

        function switchLang(lang) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(i18n[lang][key]) el.textContent = i18n[lang][key];
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        function filterProducts() {
            const query = document.getElementById('marketSearch').value.toLowerCase();
            document.querySelectorAll('.product-card').forEach(card => {
                card.style.display = card.textContent.toLowerCase().includes(query) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
